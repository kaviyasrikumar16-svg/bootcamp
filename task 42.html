<!DOCTYPE html>
<html>
<head>
    <title>Text Properties Example</title>

    <style>
        .transform {
            text-transform: uppercase;
        }

        .decoration {
            text-decoration: underline;
        }

        .spacing {
            letter-spacing: 5px;
        }
    </style>
</head>

<body>

    <h1>CSS Text Properties</h1>

    <p class="transform">
        This text demonstrates text-transform.
    </p>

    <p class="decoration">
        This text demonstrates text-decoration.
    </p>

    <p class="spacing">
        This text demonstrates letter-spacing.
    </p>

</body>
</html>
