<!DOCTYPE html>
<html>
<head>
    <title>Descendant Selector Example</title>

    <style>
        div p {
            color: blue;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div>
        <p>This paragraph is inside the div.</p>
        <p>This paragraph is also inside the div.</p>
    </div>

    <p>This paragraph is outside the div.</p>

</body>
</html>
