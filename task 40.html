<!DOCTYPE html>
<html>
<head>
    <title>Font Properties Example</title>

    <style>
        .size {
            font-size: 30px;
        }

        .weight {
            font-weight: bold;
        }

        .style {
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="size">This paragraph demonstrates font-size.</p>

    <p class="weight">This paragraph demonstrates font-weight.</p>

    <p class="style">This paragraph demonstrates font-style.</p>

</body>
</html>
