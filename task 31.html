<!DOCTYPE html>
<html>
<head>
    <title>First Child </title>

    <style>
        p:n-child {
            color: blue;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <p>This is the first paragraph and it is styled differently.</p>

    <p>This is the second paragraph.</p>
    <h1>his is the second paragraph.</h1>
    
    <p>This is the third paragraph.</p>
    <h1>his is the second paragraph.</h1>

</body>
</html>
