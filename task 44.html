<!DOCTYPE html>
<html>
<head>
    <title>Border Example</title>

    <style>
        .box {
            border: 1px solid black;
            padding: 20px;
            width: 300px;
        }
    </style>
</head>

<body>

    <h1>Box with Border</h1>

    <div class="box">
        This is a box with a 1px solid border.
    </div>

</body>
</html>
