<!DOCTYPE html>
<html>
<head>
    <title>Class Selector Example</title>

    <style>
        .blue-text {
            color: blue;
        }
    </style>
</head>

<body>

    <p class="blue-text">This is the first paragraph. It is blue.</p>

    <p class="blue-text">This is the second paragraph. It is also blue.</p>

    <p>This is the third paragraph. It has the default color.</p>

</body>
</html>
