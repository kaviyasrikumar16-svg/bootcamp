<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Element Selector */
        p {
            color: blue;
        }

        /* Class Selector */
        .highlight {
            background-color: yellow;
        }

        /* ID Selector */
        #special {
            color: red;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <p>This paragraph uses the Element Selector.</p>

    <p class="highlight">
        This paragraph uses the Class Selector.
    </p>

    <p id="special">
        This paragraph uses the ID Selector.
    </p>

    <div>
        This text is affected by the Universal Selector (*).
    </div>

</body>
</html>
