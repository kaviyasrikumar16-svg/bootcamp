<!DOCTYPE html>
<html>
<head>
    <title>Child </title>

    <style>
        div > p {
            color: green;
        }
    </style>
</head>

<body>

    <div>
        <p>This is a direct child paragraph of div.</p>

        <section>
            <p>This paragraph is inside section, so it is not a direct child.</p>
        </section>

        <p>This is another direct child paragraph of div.</p>
    </div>

</body>
</html>
