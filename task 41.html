<!DOCTYPE html>
<html>
<head>
    <title>Google Font and System Font</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        h1, h2 {
            font-family: 'Poppins', sans-serif;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>My Webpage</h1>

    <h2>About This Page</h2>

    <p>
        This paragraph uses a system font such as Arial, Helvetica, or sans-serif.
    </p>

    <p>
        The headings use the Google Font called Poppins.
    </p>

</body>
</html>
