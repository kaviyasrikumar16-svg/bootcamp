<!DOCTYPE html>
<html>
<head>
    <title>Attribute Selector Example</title>

    <style>
        input[type="text"] {
            border: 2px solid blue;
            padding: 8px;
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h2>Registration Form</h2>

    <form>
        Name:
        <input type="text" name="name">
        <br><br>

        City:
        <input type="text" name="city">
        <br><br>

        Email:
        <input type="email" name="email">
    </form>

</body>
</html>
