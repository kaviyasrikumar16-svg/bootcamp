<!DOCTYPE html>
<html>
<head>
    <title>Font Family Example</title>

    <style>
        .para1 {
            font-family: Arial;
        }

        .para2 {
            font-family: "Times New Roman";
        }

        .para3 {
            font-family: Verdana;
        }
    </style>
</head>

<body>

    <h1>Different Font Families</h1>

    <p class="para1">
        This paragraph uses Arial font.
    </p>

    <p class="para2">
        This paragraph uses Times New Roman font.
    </p>

    <p class="para3">
        This paragraph uses Verdana font.
    </p>

</body>
</html>
